# Import / shipping risk rules (PRD 8.4 "필수 규제와 수입 제한 확인").
#
# Rules attach WARNING tags to products. They are reminders to check, not
# legal determinations: requirements depend on the exact item, HS code and
# current regulations. Edit freely; a rule matches when ANY keyword appears in
# the product name / brand / variant (case-insensitive) or the category is listed.

rules:
