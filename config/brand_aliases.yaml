# Keyword dictionary for rule-based keyword expansion and demand matching.
#
# This file is maintained by the USER. Nothing here is generated by an LLM or
# scraped; add entries only after you have confirmed them yourself (PRD 9.1).
# All keys and values are matched after normalization (lower-case, NFKC,
# punctuation removed), so spelling/case differences do not matter.

# Brand (as written in products.csv) -> Korean / alternative names.
brands:
  stanley: [스탠리]
  anker: [앤커, 앵커]
  lego: [레고]
  dyson: [다이슨]
  nintendo: [닌텐도]

# Product category (products.csv `category`) -> generic Korean category terms.
# Brand + category term matches are treated as UNCERTAIN (manual review),
# because one brand can sell many products in the same category.
categories:
  kitchen: [텀블러, 보온병, 컵]
  electronics: [보조배터리, 충전기]
  toys: [장난감, 블록]
  beauty: [고데기, 드라이기, 헤어스타일러]
  gaming: [게임기, 콘솔]

# Model number (products.csv `model_number`) -> product-specific nicknames.
# Brand + nickname matches are treated as confident (auto-linked).
product_aliases:
  "10-10827": [퀜처]
  A1263: [파워코어]
  "10311": [난초]
  HS05: [에어랩]
  HEG-001: [스위치 oled, 스위치]

# Local-language names used to build overseas search queries (PRD 9.1, 9.2).
# Language codes: en (eBay), ja (Rakuten). Sample entries — check them yourself
# before relying on them. Matching uses these too, so wrong entries cause wrong
# offer matches.
local_names:
  brands:
    stanley: {ja: [スタンレー]}
    anker: {ja: [アンカー]}
    lego: {ja: [レゴ]}
    dyson: {ja: [ダイソン]}
    nintendo: {ja: [任天堂, ニンテンドー]}
  products:          # keyed by model number
    HS05: {ja: [エアラップ]}
    HEG-001: {ja: [有機elモデル]}
